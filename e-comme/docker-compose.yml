services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    environment:
      APP_NAME: ${APP_NAME:-E-commerce}
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?Define APP_KEY dans les variables Dokploy}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET dans les variables Dokploy}
      APP_URL: ${APP_URL:?Define APP_URL dans les variables Dokploy}
      FRONTEND_URL: ${FRONTEND_URL:?Define FRONTEND_URL dans les variables Dokploy}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:?Define REVERB_APP_ID dans les variables Dokploy}
      REVERB_APP_KEY: ${REVERB_APP_KEY:?Define REVERB_APP_KEY dans les variables Dokploy}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Define REVERB_APP_SECRET dans les variables Dokploy}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?Define VAPID_PUBLIC_KEY dans les variables Dokploy}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?Define VAPID_PRIVATE_KEY dans les variables Dokploy}
      VAPID_SUBJECT: ${VAPID_SUBJECT:?Define VAPID_SUBJECT dans les variables Dokploy}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-ecommerce}
      DB_USERNAME: ${DB_USERNAME:-ecommerce}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD dans les variables Dokploy}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    volumes:
      - type: volume
        source: laravel_storage
        target: /var/www/html/storage
        volume:
          nocopy: true
    depends_on:
      database:
        condition: service_healthy
      reverb:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    environment:
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?Define APP_KEY dans les variables Dokploy}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET dans les variables Dokploy}
      APP_URL: ${APP_URL:?Define APP_URL dans les variables Dokploy}
      FRONTEND_URL: ${FRONTEND_URL:?Define FRONTEND_URL dans les variables Dokploy}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:?Define REVERB_APP_ID dans les variables Dokploy}
      REVERB_APP_KEY: ${REVERB_APP_KEY:?Define REVERB_APP_KEY dans les variables Dokploy}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Define REVERB_APP_SECRET dans les variables Dokploy}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?Define VAPID_PUBLIC_KEY dans les variables Dokploy}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?Define VAPID_PRIVATE_KEY dans les variables Dokploy}
      VAPID_SUBJECT: ${VAPID_SUBJECT:?Define VAPID_SUBJECT dans les variables Dokploy}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-ecommerce}
      DB_USERNAME: ${DB_USERNAME:-ecommerce}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD dans les variables Dokploy}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    volumes:
      - type: volume
        source: laravel_storage
        target: /var/www/html/storage
        volume:
          nocopy: true
    depends_on:
      database:
        condition: service_healthy
      reverb:
        condition: service_started

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?Define APP_KEY dans les variables Dokploy}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET dans les variables Dokploy}
      APP_URL: ${APP_URL:?Define APP_URL dans les variables Dokploy}
      FRONTEND_URL: ${FRONTEND_URL:?Define FRONTEND_URL dans les variables Dokploy}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:?Define REVERB_APP_ID dans les variables Dokploy}
      REVERB_APP_KEY: ${REVERB_APP_KEY:?Define REVERB_APP_KEY dans les variables Dokploy}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Define REVERB_APP_SECRET dans les variables Dokploy}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?Define VAPID_PUBLIC_KEY dans les variables Dokploy}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?Define VAPID_PRIVATE_KEY dans les variables Dokploy}
      VAPID_SUBJECT: ${VAPID_SUBJECT:?Define VAPID_SUBJECT dans les variables Dokploy}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-ecommerce}
      DB_USERNAME: ${DB_USERNAME:-ecommerce}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD dans les variables Dokploy}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    volumes:
      - type: volume
        source: laravel_storage
        target: /var/www/html/storage
        volume:
          nocopy: true
    depends_on:
      database:
        condition: service_healthy
      reverb:
        condition: service_started

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    expose:
      - "8080"
    environment:
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?Define APP_KEY dans les variables Dokploy}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:?Define REVERB_APP_ID dans les variables Dokploy}
      REVERB_APP_KEY: ${REVERB_APP_KEY:?Define REVERB_APP_KEY dans les variables Dokploy}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Define REVERB_APP_SECRET dans les variables Dokploy}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      LOG_CHANNEL: stderr

  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ecommerce}
      MYSQL_USER: ${DB_USERNAME:-ecommerce}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD dans les variables Dokploy}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD dans les variables Dokploy}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  laravel_storage:
  mysql_data:
