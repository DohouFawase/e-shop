[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nginx", "nodejs_18", "npm-9_x"]

[phases.install]
cmds = ["composer install"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node /assets/scripts/prestart.mjs /assets/nginx.template.conf /nginx.conf && (php-fpm -y /assets/php-fpm.conf & nginx -c /nginx.conf)"